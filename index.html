<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Meals</title>
<style>
  :root { --bg:#fbf3e4; --ink:#171717; --muted:#6f6a60; --black:#171717; --white:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1a17; --ink:#f4efe6; --muted:#a39d90; --black:#f4efe6; --white:#2a2823; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 -apple-system,system-ui,"Helvetica Neue",sans-serif; padding-bottom:110px; }
  .wrap { max-width:520px; margin:0 auto; padding:0 16px; }
  header { padding:28px 0 14px; }
  h1 { margin:0; font-size:40px; line-height:1.02; letter-spacing:-.03em; font-weight:800; }
  h1 em { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-style:italic; letter-spacing:-.02em; }
  .sub { color:var(--muted); font-size:14px; margin-top:8px; }

  /* day chips */
  #days { display:flex; justify-content:space-between; gap:6px; padding:10px 0 18px; }
  #days button { position:relative; flex:1; max-width:52px; aspect-ratio:1; border-radius:50%; border:0; background:var(--white); color:var(--ink); font:600 14px/1 inherit; font-family:inherit; }
  #days button.on { background:var(--black); color:var(--bg); }
  #days button.today::after { content:""; position:absolute; bottom:7px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:currentColor; opacity:.6; }

  /* meal cards */
  .card { border-radius:30px; padding:18px 18px 16px; margin-bottom:14px; color:#171717; transition:opacity .2s; }
  .card.done { opacity:.5; }
  .head { display:flex; justify-content:space-between; align-items:center; }
  .slot { font-size:21px; font-weight:800; letter-spacing:-.02em; }
  .time { background:rgba(255,255,255,.7); border-radius:99px; padding:4px 11px; font-size:12.5px; font-weight:600; }
  ul { list-style:none; margin:14px 0 12px; padding:0; display:grid; gap:6px; }
  li { background:rgba(255,255,255,.62); border-radius:16px; padding:11px 14px; display:flex; justify-content:space-between; gap:10px; font-weight:500; }
  li span { color:#4d4a44; white-space:nowrap; font-size:14px; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; padding:13px; border-radius:99px; border:0; font:600 15px/1 inherit; font-family:inherit; background:rgba(255,255,255,.75); color:#171717; }
  .row .tick { background:#171717; color:#fff; }
  .row .tick.on { background:#fff; color:#171717; }

  .c0{background:#fcdcc0} .c1{background:#fbe58a} .c2{background:#c9ecd9} .c3{background:#f6c3d7}
  .c4{background:#d8d2f6} .c5{background:#c3daf4} .c6{background:#d2e2b6} .c7{background:#f8c0b8}

  .note { color:var(--muted); font-size:13px; text-align:center; margin:18px 0; }

  /* floating progress pill */
  #bar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#171717; color:#fff; border-radius:99px; padding:14px 22px; font-weight:600; font-size:15px; display:flex; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,.22); white-space:nowrap; }
  @media (prefers-color-scheme: dark) { #bar { background:#f4efe6; color:#171717; } }
  #bar i { display:block; width:90px; height:6px; border-radius:9px; background:rgba(128,128,128,.4); overflow:hidden; }
  #bar i b { display:block; height:100%; background:#8fd6a9; border-radius:9px; transition:width .25s; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Eat well,<br><em>one meal at a time.</em></h1>
    <div class="sub">1400 kcal plan · no shellfish · sip 2.5–3 L water</div>
  </header>
  <div id="days"></div>
  <main id="meals"></main>
  <p class="note">Don't like a meal? Tap Swap. Everything comes from your diet plan PDF.</p>
</div>
<div id="bar"></div>

<script>
const DAYS = ["M","T","W","T","F","S","S"];
const DAYNAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

// Each slot: options come straight from the PDF.
const SLOTS = [
  { name:"Early morning", time:"9:00", options:[
    ["Warm water · 1 glass","Almonds (soaked) · 5","Walnuts · 2"] ]},
  { name:"Breakfast", time:"10:00", options:[
    ["Apple · 1","Low fat milk (2%) · 1 glass"],
    ["Overnight oats with chia seeds · 1 bowl"],
    ["Idli · 2","Green chutney · 1 spoon","Sambhar · 1 bowl"],
    ["Oats upma · 1 bowl","Moong sprouts · 1 serving"],
    ["Muesli (no sugar) with milk · 1 bowl"],
    ["Moong dal chilla · 2","Curd · 1 bowl"] ]},
  { name:"Morning snack", time:"12:00", options:[
    ["Buttermilk (low fat) · 1 glass"],
    ["Chia seeds with curd · 1 bowl"] ]},
  { name:"Lunch", time:"2:00", options:[
    ["Khichdi · 1 bowl","Curd · 1 bowl"],
    ["Curd rice · 1 bowl","Boiled carrots · 1 serving","Scrambled egg · 1"],
    ["Boiled white rice · 1 bowl","Masoor dal with vegetables · 1.5 bowl"],
    ["Cucumber salad · 1 bowl","Boiled white rice · 1 bowl","Cauliflower chickpea curry · 1 bowl","Buttermilk · 1 glass"],
    ["Tomato carrot raita · 0.5 bowl","Boiled white rice · 1 bowl","Chicken curry · 1 bowl"],
    ["Paneer vegetable pulao · 1 bowl","Curd · 1 bowl"],
    ["Uttapam · 1","Coconut chutney · 1 spoon"] ]},
  { name:"Evening snack", time:"5:00", options:[
    ["Ajwain chaas · 1 glass"],
    ["Makhana · 0.5 bowl"],
    ["Moong sprouts dahi chaat · 1 bowl"],
    ["Sukha bhel · 0.5 bowl","Boiled kala chana · 0.5 serving"] ]},
  { name:"Dinner", time:"8:00", options:[
    ["Boiled white rice · 1 bowl","Vegetable curry · 1 bowl","Grilled chicken · 1"],
    ["Mixed dal vegetable khichdi · 1 bowl","Kadhi · 1 bowl","Omelette · 1"],
    ["Rice flour besan chilla · 2","Chana dal chutney · 1 spoon","Buttermilk · 1 glass"],
    ["Carrot onion salad · 1 bowl","Multigrain chapati · 1","Chicken curry · 1 bowl"],
    ["Soya peas paneer pulao · 1 bowl","Cucumber raita · 1.5 bowl"],
    ["Phulka · 2","Mixed dal (moong tuvar masoor) · 1 bowl","Lauki ki sabzi · 0.5 serving"] ]},
  { name:"Bedtime", time:"after dinner", options:[
    ["Haldi milk · 1 glass"] ]},
  { name:"Protein shake", time:"anytime 12–7", options:[
    ["Protein shake · 0.5 serving"] ]},
];

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)) } catch(e){ return null } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
};

const todayIdx = (new Date().getDay() + 6) % 7; // Mon=0
let day = todayIdx;
let state = store.get("mealstate") || {}; // {"d-s": {swap:n, done:bool}}

// Option picked for each slot, per day (Mon..Sun). Chosen so every day reaches about 90 g protein (estimated).
// Order: early, breakfast, morning snack, lunch, evening snack, dinner, bedtime, shake
const PLAN = [
  [0,2,1,1,0,0,0,0],
  [0,1,0,4,3,3,0,0],
  [0,4,1,0,1,0,0,0],
  [0,5,0,2,0,3,0,0],
  [0,4,0,4,2,5,0,0],
  [0,3,0,5,2,3,0,0],
  [0,0,0,4,2,4,0,0],
];

function optIndex(d, s) {
  const slot = SLOTS[s], sw = (state[d+"-"+s] || {}).swap || 0;
  return (PLAN[d][s] + sw) % slot.options.length;
}

function render() {
  document.getElementById("days").innerHTML = DAYS.map((n,i) =>
    `<button class="${i===day?'on':''} ${i===todayIdx?'today':''}" aria-label="${DAYNAMES[i]}" onclick="day=${i};render()">${n}</button>`).join("");

  let done = 0;
  document.getElementById("meals").innerHTML = SLOTS.map((slot,s) => {
    const st = state[day+"-"+s] || {};
    if (st.done) done++;
    const items = slot.options[optIndex(day,s)].map(t => {
      const [a,b] = t.split(" · ");
      return `<li>${a}${b ? `<span>${b}</span>` : ""}</li>`;
    }).join("");
    const swap = slot.options.length > 1 ? `<button onclick="swap(${s})">Swap</button>` : "";
    return `<div class="card c${s} ${st.done?'done':''}">
      <div class="head"><span class="slot">${slot.name}</span><span class="time">${slot.time}</span></div>
      <ul>${items}</ul>
      <div class="row">${swap}<button class="tick ${st.done?'on':''}" onclick="tick(${s})">${st.done?'Done ✓':'Mark done'}</button></div>
    </div>`;
  }).join("");

  document.getElementById("bar").innerHTML =
    `${DAYNAMES[day]} · ${done}/${SLOTS.length} done <i><b style="width:${done/SLOTS.length*100}%"></b></i>`;
}

function swap(s){ const k=day+"-"+s; state[k]=state[k]||{}; state[k].swap=(state[k].swap||0)+1; store.set("mealstate",state); render(); }
function tick(s){ const k=day+"-"+s; state[k]=state[k]||{}; state[k].done=!state[k].done; store.set("mealstate",state); render(); }
render();
</script>
</body>
</html>
