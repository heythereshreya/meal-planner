<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Meals</title>
<style>
  :root { --bg:#fbf3e4; --ink:#171717; --muted:#6f6a60; --black:#171717; --white:#fff; --line:rgba(0,0,0,.12); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1a17; --ink:#f4efe6; --muted:#a39d90; --black:#f4efe6; --white:#2a2823; --line:rgba(255,255,255,.14); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 -apple-system,system-ui,"Helvetica Neue",sans-serif; padding-bottom:110px; }
  .wrap { max-width:520px; margin:0 auto; padding:0 16px; }
  header { padding:26px 0 8px; }
  h1 { margin:0; font-size:38px; line-height:1.02; letter-spacing:-.03em; font-weight:800; }
  h1 em { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-style:italic; letter-spacing:-.02em; }
  .sub { color:var(--muted); font-size:14px; margin-top:8px; }
  h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:22px 0 10px; font-weight:700; }
  button { font-family:inherit; }

  #days { display:flex; justify-content:space-between; gap:6px; padding:12px 0 6px; }
  #days button { position:relative; flex:1; max-width:56px; height:46px; border-radius:16px; border:0; background:var(--white); color:var(--ink); font:700 13px/1 inherit; padding:0; }
  #days button.cookday { background:#fbe58a; color:#171717; }
  #days button.on { background:var(--black); color:var(--bg); }
  #days button.cookday.on { box-shadow:inset 0 0 0 3px #fbe58a; }
  #days button.today::after { content:""; position:absolute; bottom:5px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:currentColor; opacity:.6; }

  .totals { display:inline-block; background:var(--white); border-radius:99px; padding:8px 14px; font-size:14px; font-weight:600; margin-top:10px; }

  .card { border-radius:28px; padding:16px 16px 16px; margin-bottom:12px; color:#171717; cursor:pointer; }
  .hr { display:flex; gap:8px; align-items:center; }
  .tickbtn { width:38px; height:38px; border-radius:50%; border:2px solid #171717; background:transparent; color:#fff; font-size:18px; line-height:1; padding:0; }
  .tickbtn.on { background:#171717; }
  .more { margin-top:8px; font-size:13px; font-weight:700; opacity:.7; }
  .card.done { opacity:.5; }
  .head { display:flex; justify-content:space-between; align-items:center; }
  .slot { font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .time { background:rgba(255,255,255,.7); border-radius:99px; padding:3px 10px; font-size:12.5px; font-weight:600; }
  .dish { font-size:21px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin:10px 0 4px; }
  .parts { font-size:14px; color:#4d4a44; }
  .meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .tag { background:rgba(255,255,255,.65); border-radius:99px; padding:4px 10px; font-size:12.5px; font-weight:600; }
  .egg { margin-top:10px; background:rgba(255,255,255,.35); border:1.5px dashed rgba(0,0,0,.25); border-radius:14px; padding:9px 12px; font-weight:600; font-size:14.5px; display:flex; justify-content:space-between; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row button { flex:1; padding:12px; border-radius:99px; border:0; font:600 15px/1 inherit; background:rgba(255,255,255,.75); color:#171717; }
  .row .tick { background:#171717; color:#fff; }
  .row .tick.on { background:#fff; color:#171717; }
  .c-early{background:#fcdcc0} .c-breakfast{background:#fbe58a} .c-morning{background:#c9ecd9} .c-lunch{background:#f6c3d7}
  .c-evening{background:#d8d2f6} .c-dinner{background:#c3daf4} .c-bedtime{background:#d2e2b6} .c-out{background:#f8c0b8}

  .cook { background:var(--black); color:var(--bg); border-radius:28px; padding:18px; margin:14px 0 6px; }
  .cook h3 { margin:0 0 4px; font-size:20px; letter-spacing:-.02em; }
  .cook .when { opacity:.7; font-size:14px; margin-bottom:10px; }
  .cook button.item { display:flex; justify-content:space-between; width:100%; text-align:left; background:rgba(128,128,128,.25); color:inherit; border:0; border-radius:16px; padding:13px 14px; margin-top:8px; font-size:16px; font-weight:600; }
  .cook .item small { opacity:.7; font-weight:500; display:block; margin-top:2px; font-size:13px; }
  .cook .note { margin-top:12px; font-size:14px; opacity:.85; }
  .remind { background:#fbe58a; color:#171717; border-radius:20px; padding:13px 16px; margin:12px 0; font-weight:600; font-size:15px; }

  .shop-sec { background:var(--white); border-radius:24px; padding:6px 14px; margin-bottom:12px; }
  .shop-sec h3 { margin:12px 0 4px; font-size:15px; }
  label.item { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); font-size:16px; }
  label.item:first-of-type { border-top:0; }
  label.item input { width:22px; height:22px; accent-color:#3f7d58; flex:none; }
  label.item span.q { margin-left:auto; font-weight:700; white-space:nowrap; }
  label.item.got { opacity:.45; text-decoration:line-through; }
  .plain { color:var(--muted); font-size:14px; line-height:1.5; margin:8px 0 14px; }
  .btn { background:var(--white); border:0; border-radius:99px; padding:12px 18px; font-weight:600; font-size:15px; color:var(--ink); }

  .wk { background:var(--white); border-radius:24px; padding:14px 16px; margin-bottom:10px; }
  .wk b { display:block; margin-bottom:4px; }
  .wk .l { font-size:14px; color:var(--muted); }

  nav#tabs { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:#171717; border-radius:99px; padding:6px; display:flex; gap:4px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  nav#tabs button { border:0; background:transparent; color:#bdb7ab; padding:13px 17px; border-radius:99px; font-weight:700; font-size:15px; }
  nav#tabs button.on { background:#f4efe6; color:#171717; }

  #sheet { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:10; }
  #sheet.open { display:block; }
  #panel { position:absolute; left:0; right:0; bottom:0; max-height:92vh; overflow:auto; background:var(--bg); border-radius:28px 28px 0 0; padding:20px 18px 40px; max-width:560px; margin:0 auto; }
  #panel h3 { font-size:24px; letter-spacing:-.02em; margin:0 0 8px; padding-right:60px; }
  #panel .x { position:absolute; right:14px; top:14px; border:0; background:var(--white); color:var(--ink); border-radius:50%; width:40px; height:40px; font-size:20px; }
  .part { background:var(--white); border-radius:20px; padding:14px; margin:12px 0; }
  .part h4 { margin:0 0 8px; font-size:17px; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  td { padding:6px 0; border-top:1px solid var(--line); }
  tr:first-child td { border-top:0; }
  td:nth-child(n+2) { text-align:right; font-weight:700; white-space:nowrap; padding-left:10px; }
  th { text-align:right; font-size:12px; color:var(--muted); font-weight:600; padding-bottom:4px; }
  th:first-child { text-align:left; }
  ol { margin:10px 0 0; padding-left:20px; font-size:15px; }
  ol li { margin:5px 0; }
  .safe { background:#c9ecd9; color:#171717; border-radius:16px; padding:12px 14px; font-size:14px; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr"></header>
  <div id="days"></div>
  <main id="main"></main>
</div>
<nav id="tabs"></nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="panel"></div></div>

a curd + banana + egg", "slot": "light", "kcal": 275, "protein": 14, "parts": [{"name": "Chia curd", "fresh": true, "items": [{"name": "Plain curd", "g": 150, "egg": false}, {"name": "Chia seeds", "g": 5, "egg": false}], "steps": ["Stir 5 g chia into 150 g plain curd; leave 10 min."]}, {"name": "Banana", "fresh": true, "items": [{"name": "Banana", "g": 100, "egg": false}], "steps": ["1 small ripe banana (about 100 g)."]}, {"name": "Boiled egg", "fresh": true, "items": [{"name": "Eggs", "g": 50, "egg": true}], "steps": ["Use a boiled egg from your cooking-night batch."]}]}}, "light": {"options": ["lt_khichdi", "lt_dal_rice", "lt_soup", "lt_curdrice", "lt_nocook"], "day": [{"time": "9:00", "slot": "Early morning", "dish": null, "text": "Warm water only. Skip the nuts if they feel heavy."}, {"time": "10:00", "slot": "Breakfast", "dish": "lt_nocook", "text": null}, {"time": "12:00", "slot": "Morning snack", "dish": "ms_buttermilk", "text": null}, {"time": "2:00", "slot": "Lunch", "dish": "lt_khichdi", "text": null}, {"time": "5:00", "slot": "Evening snack", "dish": "es_chaas", "text": null}, {"time": "8:00", "slot": "Dinner", "dish": "lt_soup", "text": null}, {"time": "12:00", "slot": "Bedtime", "dish": "bed", "text": null}], "kcal": 1060.0, "protein": 57, "stock": [{"dish": "lt_khichdi", "portions": 4}, {"dish": "lt_dal_rice", "portions": 4}, {"dish": "lt_soup", "portions": 4}, {"dish": "lt_curdrice", "portions": 4}], "stock_list": [{"name": "Rice, white (raw)", "qty": "540 g"}, {"name": "Lauki (bottle gourd)", "qty": "520 g"}, {"name": "Mixed veg (beans, carrot, capsicum)", "qty": "400 g"}, {"name": "Moong dal (yellow, raw)", "qty": "360 g"}, {"name": "Carrot", "qty": "160 g"}], "sip": ["Ajwain chaas (curd 100 g + 150 ml water, pinch of ajwain)", "Thin buttermilk with roasted jeera", "Coconut water", "Warm jeera or ajwain water", "The clear water from the soup"]}};
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)) } catch(e){ return null } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
};
const _d = new Date(); _d.setHours(0,0,0,0); _d.setDate(_d.getDate()-_d.getDay());
const WK = _d.getFullYear()+"-"+(_d.getMonth()+1)+"-"+_d.getDate();      // the Sunday that starts this week
const load = k => { const s = store.get(k); return s && s.wk===WK ? s.v : {}; };
let done = load("done3");      // "day-slot" -> true, reset every Sunday
let got  = load("shop3");      // ingredient id -> true, reset every Sunday
const todayIdx = new Date().getDay();     // Sun = 0
let day = todayIdx, tab = "today";
const h = location.hash.slice(1);
if (h) h.split("&").forEach(p => { const [k,v]=p.split("="); if(k==="tab") tab=v; if(k==="day") day=+v; });

// how many portions of each dish are cooked in one batch
const BATCH = {};
DATA.sessions.forEach(s => s.cooks.forEach(c => BATCH[c.dish] = c.portions));
const slotClass = s => "c-" + s.toLowerCase().split(" ")[0];
const fmt = n => n.toLocaleString("en-IN");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function amount(it, mult){
  const g = it.g*mult;
  if (it.egg) { const n = g/50; return n + (n===1?" egg":" eggs"); }
  if (it.name==="Cooking oil") { const t = g/5; return (t%1? t.toFixed(1):t) + " tsp"; }
  return Math.round(g) + " g";
}

function partsLine(dish){ return DATA.dishes[dish].parts.map(p=>p.name).join(" · "); }

function render(){
  document.getElementById("tabs").innerHTML = [["today","Today"],["shop","Shop"],["week","Week"],["light","Light"]]
    .map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${l}</button>`).join("");
  document.getElementById("days").style.display = tab==="today" ? "flex" : "none";
  if (tab==="today") renderToday(); else if (tab==="shop") renderShop(); else if (tab==="week") renderWeek(); else renderLight();
}

function renderToday(){
  const d = DATA.days[day];
  const doneCount = d.slots.filter((s,i)=>done[day+"-"+i]).length;
  document.getElementById("hdr").innerHTML =
    `<h1>${d.name}<br><em>${day===todayIdx?"here's your day.":"the plan."}</em></h1>
     <div class="totals">~${fmt(d.kcal)} kcal · ${d.protein} g protein · ${doneCount}/${d.slots.length} done</div>
     <div class="sub">Sip 2.5–3 L water through the day · eat slowly, stop at 70–80% full · no shellfish</div>`;
  document.getElementById("days").innerHTML = DAYS.map((n,i)=>
    `<button class="${i===day?'on':''} ${i===todayIdx?'today':''} ${DATA.sessions.some(s=>s.day===i)?'cookday':''}" aria-label="${DATA.days[i].name}${DATA.sessions.some(s=>s.day===i)?' (cook day)':''}" onclick="day=${i};render()">${n}</button>`).join("");

  let html = "";
  const sess = DATA.sessions.find(s=>s.day===day);
  const cookCard = sess ? `<div class="cook"><h3>${sess.title}</h3><div class="when">${sess.when}</div>` +
      sess.cooks.map(c=>`<button class="item" onclick="openRecipe('${c.dish}',${c.portions})"><span>${DATA.dishes[c.dish].name}<small>make ${c.portions} portions · ${c.covers.join(", ")}</small></span><span>›</span></button>`).join("") +
      `<div class="note">${sess.eggs?`Also boil ${sess.eggs} egg${sess.eggs>1?"s":""}. `:""}Freeze the ${sess.freeze.join(" and ")} box${sess.freeze.length>1?"es":""}, and cool everything else fast before boxing.</div></div>` : "";
  if (sess) html += cookCard;
  html += `<button class="remind" style="display:block;width:100%;text-align:left;border:0;font-family:inherit;background:#c9ecd9" onclick="tab='light';render();scrollTo(0,0)">Feeling nauseous today? See the light-day options ›</button>`;
  const groups = day===0
    ? [["day","Day off · no packing"]]
    : [["home","Before you leave"],["bag","In your bag"],["home2","At home tonight"]];
  const bucket = s => day!==0 && s.group==="home" && s.slot==="Bedtime" ? "home2" : s.group;
  groups.forEach(([g,label])=>{
    const rows = d.slots.map((s,i)=>[s,i]).filter(([s])=>bucket(s)===g);
    if (!rows.length) return;
    html += `<h2>${label}</h2>`;
    rows.forEach(([s,i])=>{
      const k = day+"-"+i, dn = done[k];
      if (!s.dish){
        html += `<div class="card c-out ${dn?'done':''}"><div class="head"><span class="slot">${s.slot}</span><span class="hr"><span class="time">${s.time}</span><button class="tickbtn ${dn?'on':''}" onclick="event.stopPropagation();tick('${k}')" aria-label="Mark done">${dn?'✓':''}</button></span></div>
          <div class="dish">Eating out</div>
          <div class="parts">Pick steamed, grilled or sautéed dishes. Add protein (paneer, dal, chickpeas, tofu or chicken). Skip deep-fried food and creamy sauces. Stop at 70–80% full.</div>
          <div class="meta"><span class="tag">Assumed ~450 kcal · 25 g protein</span></div></div>`;
        return;
      }
      const dd = DATA.dishes[s.dish];
      html += `<div class="card ${slotClass(s.slot)} ${dn?'done':''}" role="button" tabindex="0" onclick="openRecipe('${s.dish}')" onkeydown="if(event.key==='Enter')openRecipe('${s.dish}')">
        <div class="head"><span class="slot">${s.slot}</span><span class="hr"><span class="time">${s.time}</span><button class="tickbtn ${dn?'on':''}" onclick="event.stopPropagation();tick('${k}')" aria-label="Mark done">${dn?'✓':''}</button></span></div>
        <div class="dish">${dd.name}</div>
        ${dd.parts.length>1?`<div class="parts">${partsLine(s.dish)}</div>`:""}
        ${s.eggs?`<div class="egg"><span>Boiled egg${s.eggs>1?'s':''}</span><span>${s.eggs} · added</span></div>`:""}
        <div class="meta"><span class="tag">${s.how}</span><span class="tag">${dd.kcal} kcal · ${dd.protein} g</span></div>
        <div class="more">Tap for recipe ›</div>
      </div>`;
    });
  });
  if (d.tonight.length) html += `<h2>Before bed</h2><div class="remind"><ul style="margin:0;padding-left:18px;font-weight:600">${d.tonight.map(x=>`<li style="margin:4px 0">${x}</li>`).join("")}</ul></div>`;
  document.getElementById("main").innerHTML = html;
}

function renderShop(){
  const total = DATA.shop.reduce((a,s)=>a+s.items.length,0);
  const have = DATA.shop.reduce((a,s)=>a+s.items.filter(i=>got[i.id]).length,0);
  document.getElementById("hdr").innerHTML =
    `<h1>Shop<br><em>once a week.</em></h1><div class="sub">Everything for Sunday to Saturday. Buy the nearest pack size.</div><div class="totals">${have}/${total} bought</div>`;
  let html = DATA.shopnotes.map(x=>`<div class="remind">${x}</div>`).join("") + DATA.shop.map(s=>`<div class="shop-sec"><h3>${s.section}</h3>` +
    s.items.map(i=>`<label class="item ${got[i.id]?'got':''}"><input type="checkbox" ${got[i.id]?'checked':''} onchange="gotIt('${i.id}')"><span>${i.name}</span><span class="q">${i.qty}</span></label>`).join("") + `</div>`).join("");
  html += `<p class="plain"><b>Check your pantry:</b> salt, turmeric, red chilli powder, coriander powder, cumin, mustard seeds, hing, garam masala, ajwain, black salt, curry leaves, ginger, garlic, green chilli, lemon.</p>
    <button class="btn" onclick="if(confirm('Clear all ticks?')){got={};store.set('shop3',{wk:WK,v:got});render();}">Clear ticks</button>`;
  document.getElementById("main").innerHTML = html;
}

function renderWeek(){
  document.getElementById("hdr").innerHTML = `<h1>Your week<br><em>3 cooks, that's it.</em></h1><div class="sub">Sunday, Tuesday night, Thursday night. Everything else is boxes.</div>`;
  let html = DATA.sessions.map(s=>`<div class="cook"><h3>${s.title}</h3><div class="when">${s.when}</div>` +
    s.cooks.map(c=>`<button class="item" onclick="openRecipe('${c.dish}',${c.portions})"><span>${DATA.dishes[c.dish].name}<small>make ${c.portions} portions · ${c.covers.join(", ")}</small></span><span>›</span></button>`).join("") +
    `<div class="note">${s.eggs?`Also boil ${s.eggs} eggs. `:""}Freeze the ${s.freeze.join(" and ")} box${s.freeze.length>1?"es":""}.</div></div>`).join("");
  html += `<div class="safe"><b>Food safety:</b> cool cooked food within 1–2 hours, box it shallow, refrigerate, and eat within 2 days. Reheat once until steaming hot all the way through. Throw away anything you're unsure about.</div>
  <p class="plain">Calories and protein are estimates (±20–30%). The PDF gives no numbers. Dishes come from your diet plan; boiled eggs, the grams, and the chicken, grilled chicken and vegetable curry methods are added by me.</p>`;
  document.getElementById("main").innerHTML = html;
}


function renderLight(){
  const L = DATA.light;
  document.getElementById("hdr").innerHTML = `<h1>Light day<br><em>for nausea days.</em></h1>
    <div class="sub">Soft, mild, small. Sip fluids all day. Everything here comes from your PDF's injection-day foods.</div>`;
  let html = `<div class="cook"><h3>A light day</h3><div class="when">About ${fmt(L.kcal)} kcal · ${L.protein} g protein</div>` +
    L.day.map(r=>r.dish
      ? `<button class="item" onclick="openRecipe('${r.dish}',1)"><span>${r.time} · ${DATA.dishes[r.dish].name}<small>${r.slot}</small></span><span>›</span></button>`
      : `<div class="item" style="display:block;margin-top:8px;background:rgba(128,128,128,.25);border-radius:16px;padding:13px 14px;font-weight:600">${r.time} · ${r.slot}<small style="display:block;opacity:.7;font-weight:500;margin-top:2px;font-size:13px">${r.text}</small></div>`).join("") +
    `<div class="note">This is a short-term fallback, not a diet. If you can't keep food down for more than a day or two, feel dizzy or weak, or can't drink, contact your dietitian or prescriber.</div></div>`;

  html += `<h2>5 light meals</h2>` + L.options.map((id,i)=>{
    const d = DATA.dishes[id], freezer = L.stock.some(s=>s.dish===id);
    return `<div class="card c-${["lunch","breakfast","evening","dinner","morning"][i]}"><div class="slot">Option ${i+1}</div>
      <div class="dish">${d.name}</div>
      <div class="meta"><span class="tag">${d.kcal} kcal · ${d.protein} g</span><span class="tag">${freezer?"From your freezer stock":"No cooking"}</span></div>
      <div class="row"><button class="tick" onclick="openRecipe('${id}',1)">See recipe</button></div></div>`;
  }).join("");

  html += `<h2>Sip all day</h2><div class="shop-sec" style="padding:12px 16px"><ul style="margin:0;padding-left:18px;line-height:1.7">${L.sip.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;

  html += `<h2>Batch cooking for light days</h2>
    <div class="cook"><h3>Stock the freezer</h3><div class="when">About 1 hour, every 2–3 weeks, when you feel well</div>
    <div class="note" style="margin-top:0">Makes 16 boxes: 4 khichdi, 4 dal and rice, 4 soup with rice, 4 plain rice. Curd, eggs, carrots and fruit are added fresh on the day.</div>
    <ol style="margin:12px 0 0;padding-left:20px;font-size:15px;line-height:1.5">
      <li>Boil and drain the rice first (540 g raw in total), then cool it flat.</li>
      <li>Cook the khichdi, the dal with veg and the soup. Use the batch recipes below.</li>
      <li>Cool everything fast, portion into boxes, and label each with the name and date.</li>
      <li>Freeze. Keep for up to 1 month.</li>
      <li>On a light day: move 1–2 boxes to the fridge the night before, and reheat once until steaming hot.</li>
    </ol>`+
    L.stock.map(s=>`<button class="item" onclick="openRecipe('${s.dish}',${s.portions})"><span>${DATA.dishes[s.dish].name}<small>make ${s.portions} portions</small></span><span>›</span></button>`).join("") + `</div>`;

  html += `<h2>Buy once for the stock</h2><div class="shop-sec">` +
    L.stock_list.map(i=>`<label class="item" style="cursor:default"><span>${i.name}</span><span class="q">${i.qty}</span></label>`).join("") + `</div>
    <p class="plain">These are extra to your weekly Shop list. Curd, eggs and fruit for light days come from your normal shopping.</p>`;
  document.getElementById("main").innerHTML = html;
}


function scaleText(s, n){
  if (n===1) return s;
  const num = x => x==="½"?0.5:x==="¼"?0.25:x==="¾"?0.75:parseFloat(x);
  const out = (v,u) => { const r = /^\s?(g|ml)$/.test(u) ? Math.round(v/5)*5 : Math.round(v*10)/10; return String(r); };
  return s.replace(/(½|¼|¾|\d+(?:\.\d+)?)(?:–(½|¼|¾|\d+(?:\.\d+)?))?(\s?(?:g|ml|tsp|tbsp|eggs?))(?![a-z])/g,
    (m,a,b,u)=> out(num(a)*n,u) + (b? "–"+out(num(b)*n,u) : "") + (u.trim()==="egg" && num(a)*n>1 ? u+"s" : u));
}

function openRecipe(id, portions){
  const d = DATA.dishes[id], n = portions || BATCH[id] || 1;
  let html = `<button class="x" onclick="closeSheet()" aria-label="Close">×</button><h3>${d.name}</h3>
    <div class="meta" style="margin-bottom:6px"><span class="tag" style="background:var(--white)">${d.kcal} kcal per portion</span><span class="tag" style="background:var(--white)">${d.protein} g protein</span></div>`;
  if (n>1) html += `<p class="plain" style="margin:6px 0">You cook <b>${n} portions</b> at once. Every amount below is already for all ${n}.</p>`;
  d.parts.forEach(p=>{
    const pn = p.fresh ? 1 : n;
    html += `<div class="part"><h4>${p.name}</h4>${p.fresh&&n>1?`<p class="plain" style="margin:0 0 8px"><b>Not part of the batch.</b> Add this fresh when you eat or pack it (1 portion).</p>`:""}<table>` +
      p.items.map(it=>`<tr><td>${it.name}</td><td>${amount(it,pn)}</td></tr>`).join("") +
      `</table><ol>${p.steps.map(s=>`<li>${esc(scaleText(s,pn))}</li>`).join("")}</ol></div>`;
  });
  if (n>1) html += `<div class="safe">Cool fast, box in portions, refrigerate. Eat within 2 days; reheat once until steaming hot.</div>`;
  document.getElementById("panel").innerHTML = html;
  document.getElementById("sheet").classList.add("open"); document.body.style.overflow = "hidden";
  document.getElementById("panel").scrollTop = 0;
}
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key==="Escape") closeSheet(); });
function tick(k){ done[k] = !done[k]; store.set("done3", {wk:WK, v:done}); render(); }
function gotIt(id){ got[id] = !got[id]; store.set("shop3", {wk:WK, v:got}); render(); }
render();
if (h) { const m = h.match(/r=([a-z_]+)/); if (m) openRecipe(m[1]); }
</script>
